# Render "Blueprint": tells Render how to run the backend.
# Render → New → Blueprint → pick this GitHub repo. It reads this file.
services:
  - type: web
    name: pill-reminder-api
    runtime: node
    plan: free
    region: singapore           # closest Render region to Malaysia
    rootDir: backend              # the API lives in the backend/ folder of this repo
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL         # paste your Neon connection string when Render asks
        sync: false
      - key: JWT_ACCESS_SECRET    # Render makes a long random secret for you
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "30"
      - key: CORS_ORIGINS         # browsers allowed to call the API: the admin panel, local and online
        value: http://localhost:5173,https://pill-reminder-admin.onrender.com

  # The Web Admin panel: built once into plain files, served for free.
  - type: web
    name: pill-reminder-admin
    runtime: static
    rootDir: admin
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL    # must match the API service's address above
        value: https://pill-reminder-api.onrender.com/api/v1
